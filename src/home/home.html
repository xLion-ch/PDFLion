<!doctype html>
<!--
  Home: the recent documents, and Open and New. Each window's home tab, its
  leftmost, shows it, and a document opened from it opens in a new tab. home.js draws it from what
  the host sends through window.pdflionHome: main's, through
  src/preload/home.cjs, or the web app's shell's, through
  src/web/home-host.js, which scripts/build-web.js adds.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Home</title>
    <link rel="stylesheet" href="home.css" />
    <script src="../shared/texts.js"></script>
    <script src="home.js" defer></script>
  </head>
  <body>
    <header>
      <h1><img class="logo" src="logo.svg" alt="" />PDFLion</h1>
      <div class="actions">
        <button type="button" class="button filled open" data-text="openFile">Open…</button>
        <button type="button" class="button outlined new" data-text="new">New</button>
        <button type="button" class="icon info" id="info" title="About, Settings and Storage" aria-label="About, Settings and Storage" data-label="homeInfo" hidden></button>
      </div>
    </header>
    <main>
      <section id="recent" hidden>
        <div class="heading">
          <h2 id="recentHeading" data-text="recent">Recent</h2>
          <button type="button" class="button text" id="clear" data-text="clear">Clear</button>
        </div>
        <ul id="documents" aria-labelledby="recentHeading"></ul>
      </section>
      <section id="empty" hidden>
        <p class="message" data-text="noRecent">No recent documents</p>
        <p class="hint" data-text="noRecentHint">Open a PDF or make a new one. You can also drop PDFs here.</p>
        <div class="actions">
          <button type="button" class="button filled large open" data-text="openFile">Open…</button>
          <button type="button" class="button outlined large new" data-text="new">New</button>
        </div>
      </section>
    </main>
  </body>
</html>
