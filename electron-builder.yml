appId: io.github.xlion-ch.pdflion # also APP_ID in src/main/main.js
productName: PDFLion
# PDFLion-1.0.0-mac-arm64.dmg, PDFLion-1.0.0-mac-x64.dmg, PDFLion-1.0.0-win-x64.exe,
# PDFLion-1.0.0-linux-x64.deb, …
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  buildResources: resources
  output: dist
files:
  - src/**
  - package.json
  - LICENSE
  - resources/about-icon.png # Windows' About box
  # Of @cantoo/pdf-lib, only the browser build the viewer loads from /lib/, which
  # bundles its dependencies, and its licence. The rest is 30 MB of other builds.
  - "!node_modules/@cantoo/pdf-lib/{cjs,es,src,ts3.4}/**"
  - "!node_modules/@cantoo/pdf-lib/dist/!(pdf-lib.min.js)"
  - "!node_modules/{culori,fflate,tslib,node-html-better-parser,html-entities}/**"
extraResources:
  - from: vendor/pdf.js/build/generic
    to: pdfjs
    filter: ["**/*", "!**/*.map", "!web/debugger.*", "!web/compressed.tracemonkey-pldi-09.pdf"]
  - from: vendor/pdf.js/build/version.json
    to: pdfjs/version.json
# Where the releases are. With it, every build writes the update files next to
# its installers (latest-mac.yml, latest.yml, latest-linux.yml, and a .blockmap
# for each but the .deb), and app-update.yml into the app's resources, which
# tells the updater where to look. CI builds with --publish never.
publish:
  provider: github
  owner: xLion-ch
  repo: PDFLion
fileAssociations:
  - ext: pdf
    name: PDF Document
    role: Editor
    rank: Alternate
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  # No Developer ID and no notarization, by choice, but signed ad hoc: Apple
  # silicon runs only signed code, and flipping the fuses changes the Electron
  # binary. electron-builder's default entitlements include the
  # disable-library-validation that the hardened runtime then needs.
  identity: "-"
  hardenedRuntime: true
win:
  target:
    - target: nsis
      arch: [x64]
# A .deb for Ubuntu and Linux Mint, installed into /opt/PDFLion. No AppImage:
# it can't carry Chromium's setuid sandbox helper, and Ubuntu 24.04 restricts
# the user namespaces the sandbox needs otherwise, so it would only run with
# --no-sandbox. The .deb's post-install script sets up whichever of the two
# the system needs, with an AppArmor profile on Ubuntu 24.04 and later.
linux:
  target:
    - target: deb
      arch: [x64]
  category: Office
  # Installed into hicolor/scalable/apps. The 1024 px icon.png would go into
  # hicolor/1024x1024, a size the hicolor theme doesn't list.
  icon: icon.svg
  executableName: pdflion
  # Without a field code, electron-builder adds %U, and file managers pass
  # URIs. %F makes them pass paths.
  executableArgs: ["%F"]
  # Names the .desktop file after desktopName in package.json, which Electron
  # uses as the Wayland app ID and X11 WM_CLASS, so the dock groups windows
  # with their launcher.
  syncDesktopName: true
  # Lists PDFLion under Open With for PDFs, without making it the default.
  # Not as a mimeType in fileAssociations: electron-builder would then also
  # install a MIME definition for application/pdf, whose icon replaces the
  # PDF icon in file managers.
  mimeTypes: [application/pdf]
  # The package's summary in apt and software centres. The description follows
  # it there, and is the launcher's tooltip.
  synopsis: PDF viewer built on Mozilla's pdf.js
  description: View PDFs, fill in forms and add annotations
  maintainer: "xLion-ch <181110832+xLion-ch@users.noreply.github.com>"
# Electron's compile-time switches, flipped in the packaged binary.
electronFuses:
  # Ignore ELECTRON_RUN_AS_NODE, NODE_OPTIONS and --inspect, which would let
  # anyone who can start PDFLion run code inside it.
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  # Load the app only from app.asar, and only if its hash matches the one
  # electron-builder records in Info.plist or the .exe.
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  # No page loads from file://. Main reads the viewer's files through file://
  # URLs, which this doesn't affect.
  grantFileProtocolExtraPrivileges: false
