# Tests PDFLion on macOS, Windows and Linux, and its web app, for every pull
# request into main and every push to main or dev. Only a push to main builds
# the installers, which it keeps for 14 days, and once it passed on all three
# and the web app's tests, makes them a published GitHub release, and deploys
# the web app of the same commit to GitHub Pages. A pull request, such as
# dev's into main, and a push to dev run the tests only. dev's installers
# would have a release's version (scripts/version.js), which would keep a copy
# installed from one from updating to the releases below it. A pull request
# from this repository keeps its web app's build, to try on an iPad before
# merging. A push that changes only Markdown runs nothing, so it makes no
# release, but a pull request always runs, since a required check that never
# runs blocks the merge.
#
# Only GitHub's own actions, each pinned to the commit of its release, and
# the GitHub CLI.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
    paths-ignore: ["**/*.md"]

# Only the release job writes to the repository, and only the pages job to
# GitHub Pages.
permissions:
  contents: read

# A new run of a pull request, or of dev, cancels its previous one. Runs on
# main share one group and never cancel a running one, so a release is never
# cut short. GitHub drops all but the newest of those waiting, whose release
# has a higher version and the skipped commits in it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The pdf.js build doesn't depend on the platform, so it's built once, and
  # only again when the submodule moves.
  pdfjs:
    name: pdf.js
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned pdf.js commit
        id: pin
        run: echo "commit=$(git rev-parse HEAD:vendor/pdf.js)" >> "$GITHUB_OUTPUT"

      - name: Restore the pdf.js build
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor/pdf.js/build/generic
            vendor/pdf.js/build/version.json
          key: pdfjs-${{ steps.pin.outputs.commit }}

      # With its full history, since pdf.js counts its commits for its version.
      - name: Check out pdf.js
        if: steps.cache.outputs.cache-hit != 'true'
        run: git submodule update --init vendor/pdf.js

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version-file: .nvmrc

      - name: Build pdf.js
        if: steps.cache.outputs.cache-hit != 'true'
        run: node scripts/update-pdfjs.js --build

      - name: Upload the pdf.js build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfjs
          path: |
            vendor/pdf.js/build/generic
            vendor/pdf.js/build/version.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: ${{ matrix.platform }}
    needs: pdfjs
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # The same on every platform, since each counts the same commits.
    outputs:
      version: ${{ steps.version.outputs.version }}
    # Whether the run builds installers: only for a push to main.
    env:
      INSTALLERS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      # A failure on one platform doesn't stop the others.
      fail-fast: false
      matrix:
        include:
          # Both Mac architectures, as on a Mac.
          - platform: mac
            runner: macos-26 # Apple silicon
            builder: --mac
          - platform: windows
            runner: windows-2025
            builder: --win
          - platform: linux
            runner: ubuntu-24.04
            builder: --linux
    steps:
      # The whole history, since the version counts its commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Without its history, only for its test/pdfs, which some tests read.
      # Its build comes from the pdfjs job.
      - name: Check out pdf.js
        run: git submodule update --init --depth 1 vendor/pdf.js

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The electron package fetches its binary the first time it runs, not
      # as it installs. Linux's sandbox step needs the binary's helper.
      - name: Download Electron
        run: node node_modules/electron/install.js

      - name: Download the pdf.js build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pdfjs
          path: vendor/pdf.js/build

      - name: Check the pdf.js build against the pinned commit
        run: node scripts/update-pdfjs.js --check-build

      - name: Unit tests
        run: npm test

      # Ubuntu 24.04 restricts the user namespaces Chromium's sandbox needs.
      # Its setuid helper works without them, as the .deb sets it up where it
      # has to, so the tests never need --no-sandbox.
      - name: Make Chromium's sandbox helper setuid
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: End-to-end tests
        if: runner.os != 'Linux'
        run: npm run test:e2e

      # xvfb-run's own screen is 640 × 480, smaller than the tests' windows.
      - name: End-to-end tests, on a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:e2e

      - name: Work out the version
        if: env.INSTALLERS == 'true'
        id: version
        shell: bash
        run: echo "version=$(node scripts/version.js)" >> "$GITHUB_OUTPUT"

      # The update files too, since electron-builder.yml has a publish
      # section, but nothing is published.
      - name: Build the installers
        if: env.INSTALLERS == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm run dist -- ${{ matrix.builder }} --publish never "-c.extraMetadata.version=$VERSION"

      # The installers and their .blockmap files, by their names
      # (artifactName in electron-builder.yml), and the update files, for the
      # release job.
      - name: Upload the installers
        if: env.INSTALLERS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PDFLion-${{ steps.version.outputs.version }}-${{ matrix.platform }}
          path: |
            dist/PDFLion-${{ steps.version.outputs.version }}-*
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright's report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.platform }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The web app (scripts/build-web.js), tested in Playwright's WebKit, as an
  # iPad, and its Chromium, as an Android tablet, on macOS, whose WebKit is
  # closest to Safari's. For a push to main, its build is what the pages job
  # deploys, once the release is out.
  web:
    name: web
    needs: pdfjs
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Whether the build is deployed: only for a push to main.
      DEPLOY: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Whether the build is kept to try: for a pull request from this
      # repository, not a fork.
      KEEP: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      # The whole history, since the web app's version counts its commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Its build comes from the pdfjs job.
      - name: Check out pdf.js
        run: git submodule update --init --depth 1 vendor/pdf.js

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Download the pdf.js build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pdfjs
          path: vendor/pdf.js/build

      - name: Check the pdf.js build against the pinned commit
        run: node scripts/update-pdfjs.js --check-build

      - name: Download Playwright's WebKit and Chromium
        run: npx playwright install webkit chromium

      # The same version as the installers', which About shows and the
      # update prompt names.
      - name: Work out the version
        id: version
        run: echo "version=$(node scripts/version.js)" >> "$GITHUB_OUTPUT"

      - name: Build the web app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/build-web.js --version "$VERSION"

      # Against that build, which npm run test:web would build again.
      - name: Web tests
        run: npx playwright test --config test/web/playwright.config.js

      - name: Upload the web app for GitHub Pages
        if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/web

      # To serve with npm run web:serve -- --https <folder> (README).
      - name: Upload the web app to try
        if: env.KEEP == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PDFLion-${{ steps.version.outputs.version }}-web
          path: dist/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright's report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-web
          path: |
            playwright-report/web/
            test-results/web/
          if-no-files-found: ignore
          retention-days: 14

  # Every push to main that passed on all three platforms and the web app's
  # tests becomes a published release, v<version>, tagged on its commit, with
  # every platform's installers and update files.
  release:
    name: Release
    needs: [build, web]
    # Not for pull requests, nor for a push to a fork's main. With no status
    # function in the condition, success() applies too, so a platform that
    # failed, or was skipped, means no release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'xLion-ch/PDFLion'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The repository's settings limit this environment to main.
    environment: release
    # The only write token: releases, and the tag publishing one makes.
    permissions:
      contents: write
    # Whether this run published its release, after which the pages job
    # deploys its web app. Unset when it released nothing.
    outputs:
      published: ${{ steps.publish.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      TAG: v${{ needs.build.outputs.version }}
    steps:
      - name: Download the installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: PDFLion-${{ needs.build.outputs.version }}-*
          path: release
          merge-multiple: true

      # With gh, which needs no checkout, since GH_REPO names the repository.
      - name: Publish the release
        id: publish
        working-directory: release
        run: |
          # A re-run, or a run for an older commit than the latest release's,
          # which has this one's changes in it already.
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ "$latest" = "$TAG" ]; then
            echo "::notice::$TAG is out already."
            exit 0
          fi
          if [ -n "$latest" ] && [ "$(printf '%s\n' "$latest" "$TAG" | sort -V | tail -n 1)" = "$latest" ]; then
            echo "::notice::$latest is out already, with this commit in it, so $TAG isn't released."
            exit 0
          fi

          # The installers, and their .blockmap files and the update files,
          # which name them. A release missing one would break updates.
          files=()
          for arch in arm64 x64; do
            for ext in dmg zip; do
              files+=("PDFLion-$VERSION-mac-$arch.$ext" "PDFLion-$VERSION-mac-$arch.$ext.blockmap")
            done
          done
          files+=(
            "PDFLion-$VERSION-win-x64.exe" "PDFLion-$VERSION-win-x64.exe.blockmap"
            "PDFLion-$VERSION-linux-amd64.deb"
            latest-mac.yml latest.yml latest-linux.yml
          )
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing."
              exit 1
            fi
          done

          # Drafts left with this tag by earlier runs that failed. The API
          # lists drafts only to those who can write. Assigned first, so that
          # a failed listing stops the step.
          drafts=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.draft and .tag_name == env.TAG) | .id')
          for id in $drafts; do
            gh api --method DELETE "repos/$GH_REPO/releases/$id"
          done

          # A draft first, which nobody sees until it has every file, then
          # published, which creates the tag, as the latest release, which
          # /releases/latest leads to.
          gh release create "$TAG" "${files[@]}" --draft --target "$GITHUB_SHA" --title "PDFLion $VERSION" --generate-notes
          gh release edit "$TAG" --draft=false --latest
          echo "published=true" >> "$GITHUB_OUTPUT"

  # The web app of the release this run published, at
  # https://xlion-ch.github.io/PDFLion/. Only after a release, so a re-run, or
  # a run for an older commit, never deploys an older web app over a newer
  # one. It checks nothing out and runs no code of the repository: it hands
  # the web job's build to GitHub Pages.
  pages:
    name: GitHub Pages
    needs: release
    if: needs.release.outputs.published == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'xLion-ch/PDFLion'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The repository's settings limit this environment to main.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deploying to Pages, with an OIDC token that proves this run asks, and
    # nothing else.
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
